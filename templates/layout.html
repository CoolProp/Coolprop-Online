<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[=globals().get('page_title', 'CoolProp Online')]]</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding-top: 20px;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 50px;
            padding: 20px 0;
            border-top: 1px solid #e5e5e5;
        }
    </style>

    [[block head]][[end]]
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="[[=URL('index')]]">CoolProp Online</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="[[=URL('index')]]">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Flash messages -->
    [[if globals().get('flash'):]]
    <div class="container">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            [[=flash]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    [[pass]]

    <!-- Main content -->
    <div class="container">
        [[if globals().get('page_title'):]]
        <div class="page-header">
            <h1>[[=page_title]]</h1>
        </div>
        [[pass]]

        [[include]]
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted">Copyright &copy; 2025</p>
                </div>
                <div class="col-md-6 text-end">
                    <p class="text-muted">Powered by <a href="https://py4web.com">py4web</a></p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    [[block scripts]][[end]]
</body>
</html>
