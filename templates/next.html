[[extend 'layout.html']]

<div class="row">
    <div class="col-md-10 offset-md-1">
        <h1>[[=fluid]]</h1>

        <h2>At the specified state point</h2>
        <div class="card mb-4">
            <div class="card-body">
                [[=form]]
            </div>
        </div>

        <h2>A p-T saturation plot</h2>
        <div class="card">
            <div class="card-body">
                [[=fig]]
            </div>
        </div>

        <div class="mt-3">
            <a href="[[=URL('index')]]" class="btn btn-primary">Calculate Another State</a>
        </div>

        <div class="mt-4">
            <p class="text-muted small">
                CoolProp version: [[=cp_version]] | Git revision: [[=cp_gitrev]]
            </p>
        </div>
    </div>
</div>
